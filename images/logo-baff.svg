<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <clipPath id="fl">
      <rect x="0" y="0" width="195" height="90"/>
    </clipPath>
    <clipPath id="fr">
      <rect x="195" y="0" width="185" height="90"/>
    </clipPath>
  </defs>
  <!-- Row 1: "BA" large bold -->
  <text x="0" y="36" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="42" fill="#1a1a1a" letter-spacing="3">BA</text>
  <!-- Row 2 left: "Film" italic -->
  <text x="0" y="72" font-family="'Playfair Display', Georgia, serif" font-weight="400" font-style="italic" font-size="30" fill="#1a1a1a">Film</text>
  <!-- Row 2: Large "F" - black left portion -->
  <text x="82" y="82" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="80" fill="#1a1a1a" clip-path="url(#fl)">F</text>
  <!-- Row 2: Large "F" - red right portion -->
  <text x="82" y="82" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="80" fill="#c0392b" clip-path="url(#fr)">F</text>
  <!-- Red rectangle for "estival" -->
  <rect x="148" y="42" width="140" height="42" fill="#c0392b"/>
  <!-- "estival" white on red -->
  <text x="155" y="72" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="2">estival</text>
</svg>
